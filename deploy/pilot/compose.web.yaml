name: ma24-pilot

services:
  web:
    image: ${PILOT_WEB_IMAGE:?Set PILOT_WEB_IMAGE to the verified image tag}
    env_file:
      - ${PILOT_WEB_ENV_FILE:?Set PILOT_WEB_ENV_FILE to an absolute path}
    environment:
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: ${PILOT_WEB_PORT:-3000}
    network_mode: host
    volumes:
      - pilot_uploads:/app/knowledge/uploads
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+process.env.PORT+'/api/auth/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pilot_uploads:
