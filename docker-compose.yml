services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: network_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - network_copilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d network_copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  network_copilot_pgdata:
